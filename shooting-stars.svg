<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">SPYLEAN Shooting Star Mission</title>
  <desc id="desc">A looping dark violet shooting-star animation styled like the SPYLEAN creative technology portfolio.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0A15"/>
      <stop offset="0.55" stop-color="#130C20"/>
      <stop offset="1" stop-color="#09060F"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="nebula" cx="70%" cy="20%" r="75%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#322640" stroke-width="1" opacity="0.24"/>
    </pattern>
  </defs>

  <style>
    .twinkle { animation: twinkle 2.8s ease-in-out infinite; }
    .t2 { animation-delay: -0.8s; }
    .t3 { animation-delay: -1.7s; }
    .comet-a { animation: shoot-a 5.2s linear infinite; }
    .comet-b { animation: shoot-b 6.4s linear infinite; animation-delay: -3.1s; }
    .comet-c { animation: shoot-c 7.1s linear infinite; animation-delay: -5.2s; }
    .comet-d { animation: shoot-d 4.7s linear infinite; animation-delay: -1.9s; }
    .ship { animation: patrol 8s ease-in-out infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    .scan { animation: scan 3.6s linear infinite; }
    @keyframes twinkle { 0%,100% { opacity:.22 } 50% { opacity:1 } }
    @keyframes shoot-a { 0% { transform:translate(0,0);opacity:0 } 8% { opacity:1 } 58%,100% { transform:translate(-1180px,390px);opacity:0 } }
    @keyframes shoot-b { 0% { transform:translate(0,0);opacity:0 } 10% { opacity:.9 } 64%,100% { transform:translate(-980px,330px);opacity:0 } }
    @keyframes shoot-c { 0% { transform:translate(0,0);opacity:0 } 12% { opacity:.8 } 62%,100% { transform:translate(-760px,260px);opacity:0 } }
    @keyframes shoot-d { 0% { transform:translate(0,0);opacity:0 } 8% { opacity:1 } 60%,100% { transform:translate(-620px,205px);opacity:0 } }
    @keyframes patrol { 0%,100% { transform:translateX(-120px) } 50% { transform:translateX(120px) } }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes scan { 0% { transform:translateX(-1060px);opacity:0 } 12%,88% { opacity:.4 } 100% { transform:translateX(1060px);opacity:0 } }
  </style>

  <rect width="1280" height="320" rx="20" fill="url(#sky)"/>
  <rect x="1" y="1" width="1278" height="318" rx="19" fill="none" stroke="#3B2C4E" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="318" rx="19" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="318" rx="19" fill="url(#nebula)"/>

  <g fill="#D8B4FE">
    <circle class="twinkle" cx="92" cy="92" r="1.8"/><circle class="twinkle t2" cx="174" cy="148" r="1.3"/>
    <circle class="twinkle t3" cx="255" cy="72" r="2"/><circle class="twinkle t2" cx="335" cy="185" r="1.5"/>
    <circle class="twinkle" cx="430" cy="108" r="1.2"/><circle class="twinkle t3" cx="535" cy="160" r="2"/>
    <circle class="twinkle t2" cx="642" cy="87" r="1.4"/><circle class="twinkle" cx="742" cy="175" r="1.8"/>
    <circle class="twinkle t3" cx="838" cy="102" r="1.2"/><circle class="twinkle t2" cx="947" cy="153" r="2"/>
    <circle class="twinkle" cx="1074" cy="86" r="1.6"/><circle class="twinkle t3" cx="1172" cy="176" r="1.4"/>
  </g>
  <g fill="#EDECE8" opacity="0.7">
    <circle cx="128" cy="201" r="1"/><circle cx="298" cy="119" r="1"/><circle cx="389" cy="61" r="1"/>
    <circle cx="581" cy="209" r="1"/><circle cx="702" cy="129" r="1"/><circle cx="884" cy="218" r="1"/>
    <circle cx="1015" cy="117" r="1"/><circle cx="1126" cy="225" r="1"/>
  </g>

  <g transform="translate(1210 12)"><g class="comet-a" filter="url(#softGlow)"><path d="M-105 52L0 0" stroke="url(#trail)" stroke-width="3"/><circle r="3.5" fill="#F5F3FF"/></g></g>
  <g transform="translate(1120 58)"><g class="comet-b" filter="url(#softGlow)"><path d="M-78 39L0 0" stroke="url(#trail)" stroke-width="2.4"/><circle r="3" fill="#C084FC"/></g></g>
  <g transform="translate(930 18)"><g class="comet-c" filter="url(#softGlow)"><path d="M-62 31L0 0" stroke="url(#trail)" stroke-width="2"/><circle r="2.5" fill="#A78BFA"/></g></g>
  <g transform="translate(1235 105)"><g class="comet-d" filter="url(#softGlow)"><path d="M-50 25L0 0" stroke="url(#trail)" stroke-width="1.8"/><circle r="2.2" fill="#F5F3FF"/></g></g>

  <g transform="translate(640 261)"><g class="ship">
    <path d="M0-20L16 13L0 7L-16 13Z" fill="#15101F" stroke="#C084FC" stroke-width="2"/>
    <path d="M0-11L5 3L0 1L-5 3Z" fill="#EDECE8" class="pulse"/>
    <path d="M-7 13L0 25L7 13" fill="url(#energy)" opacity="0.85"/>
  </g></g>

  <g transform="translate(640 156)" opacity="0.5">
    <circle r="24" fill="none" stroke="#9165E5" stroke-width="1" stroke-dasharray="4 6"/>
    <path d="M-36 0H-13M13 0H36M0-36V-13M0 13V36" stroke="#C084FC"/>
    <circle r="3" fill="#C084FC" class="pulse"/>
  </g>
  <rect class="scan" x="630" y="48" width="20" height="184" fill="#C084FC" opacity="0.2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="40" fill="#C084FC" font-size="11" font-weight="700" letter-spacing="3.2">05 — ORBITAL ACTIVITY / LIVE</text>
    <text x="34" y="67" fill="#EDECE8" font-size="19" font-weight="800" letter-spacing="2">SHOOTING STAR MISSION</text>
    <text x="34" y="88" fill="#82788C" font-size="10" font-weight="700" letter-spacing="2">MAKE A WISH. BUILD THE WORLD.</text>

    <g transform="translate(1010 27)">
      <rect width="236" height="68" rx="10" fill="#15101F" stroke="#3B2C4E"/>
      <circle cx="18" cy="21" r="4" fill="#34D399" class="pulse"/>
      <text x="31" y="25" fill="#EDECE8" font-size="10" font-weight="700" letter-spacing="1.5">STARFIELD ONLINE</text>
      <text x="16" y="50" fill="#82788C" font-size="9" font-weight="700" letter-spacing="1.8">COLLECTED</text>
      <text x="91" y="50" fill="#C084FC" font-size="12" font-weight="800">07</text>
      <text x="139" y="50" fill="#82788C" font-size="9" font-weight="700" letter-spacing="1.8">WAVE</text>
      <text x="190" y="50" fill="#EDECE8" font-size="12" font-weight="800">04</text>
    </g>

    <text x="34" y="286" fill="#82788C" font-size="9" font-weight="700" letter-spacing="2">OBSERVER CRAFT // AUTOPILOT</text>
    <rect x="34" y="298" width="210" height="3" rx="1.5" fill="#2F253A"/>
    <rect x="34" y="298" width="148" height="3" rx="1.5" fill="url(#energy)"/>
    <text x="1019" y="286" fill="#82788C" font-size="9" font-weight="700" letter-spacing="2">SPYLEAN UNIVERSE</text>
    <text x="1019" y="303" fill="#EDECE8" font-size="10" font-weight="700" letter-spacing="1.5">CREATIVE × TECH</text>
  </g>
</svg>
