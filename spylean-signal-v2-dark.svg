  <rect x="30" y="74" width="555" height="240" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="58" y="106" class="eyebrow">PROFILE.SIGNAL / VERIFIED PUBLIC DATA</text>
  <line x1="58" y1="118" x2="557" y2="118" class="line"/>
  <g transform="translate(58 142)">
    <rect width="112" height="72" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="36" class="number">11</text><text x="14" y="57" class="metric">PUBLIC REPOS</text>
  </g>
  <g transform="translate(180 142)">
    <rect width="112" height="72" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="36" class="number">10</text><text x="14" y="57" class="metric">NON-EMPTY</text>
  </g>
  <g transform="translate(302 142)">
    <rect width="112" height="72" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="36" class="number">03</text><text x="14" y="57" class="metric">ACTIVE IN SEP</text>
  </g>
  <g transform="translate(424 142)">
    <rect width="112" height="72" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="36" class="number">06</text><text x="14" y="57" class="metric">FOLLOWERS</text>
  </g>
  <circle cx="62" cy="242" r="3.5" fill="#3fb950" class="pulse"/><text x="76" y="246" class="title">VARUNA</text><text x="250" y="246" class="micro">LATEST BUILD · PYTHON</text>
  <circle cx="62" cy="269" r="3.5" fill="#3fb950" class="pulse" style="animation-delay:.35s"/><text x="76" y="273" class="title">KYNTRA</text><text x="250" y="273" class="micro">ACTIVE · PYTHON / TYPESCRIPT</text>
  <circle cx="62" cy="296" r="3.5" fill="#d29922"/><text x="76" y="300" class="title">ROUTEWEIGH</text><text x="250" y="300" class="micro">WIP · REPOSITORY INITIALIZED</text>

  <rect x="610" y="74" width="560" height="240" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="638" y="106" class="eyebrow">CURRENT.TECHNICAL.RANGE</text>
  <line x1="638" y1="118" x2="1142" y2="118" class="line"/>
  <text x="638" y="148" class="title">APPLIED AI &amp; ML</text><text x="638" y="169" class="stack">Python · FastAPI · ML pipelines · LLM systems</text>
  <line x1="638" y1="185" x2="1142" y2="185" class="line"/>
  <text x="638" y="211" class="title">FULL-STACK PRODUCT</text><text x="638" y="232" class="stack">TypeScript · React · Next.js · Node.js</text>
  <line x1="638" y1="248" x2="1142" y2="248" class="line"/>
  <text x="638" y="274" class="title">DATA &amp; SIMULATION</text><text x="638" y="295" class="stack">Pandas · SQL · geospatial · telemetry</text>

  <rect x="30" y="332" width="1140" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <line x1="30" y1="332" x2="1170" y2="332" stroke="#58a6ff" stroke-width="2" class="sweep"/>
  <text x="52" y="357" class="title">CURRENT FOCUS: EVIDENCE-AWARE SOFTWARE FOR REAL-WORLD DECISIONS</text>
  <text x="1025" y="357" class="micro">GITHUB API / PUBLIC</text>
</svg>
