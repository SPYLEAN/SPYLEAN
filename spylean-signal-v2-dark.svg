<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">SPYLEAN public GitHub signal</title>
  <desc id="desc">A September 2026 snapshot of public repositories, current technical range, and recent project activity.</desc>
  <defs>
    <style>
      .header{font:650 14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.5px;fill:#c9d1d9}
      .eyebrow{font:750 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.35px;fill:#58a6ff}
      .number{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f0f6fc}
      .metric{font:700 9px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.8px;fill:#8b949e}
      .title{font:700 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.6px;fill:#f0f6fc}
      .stack{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#58a6ff}
      .body{font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .micro{font:500 9px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.9px;fill:#6e7681}
      .line{stroke:#30363d;stroke-width:1}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
      .sweep{stroke-dasharray:90 1100;animation:sweep 7s linear infinite}
      @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.18)}}
      @keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-1190}}
      @media (prefers-reduced-motion:reduce){.pulse,.sweep{animation:none!important}.pulse{opacity:1}.sweep{stroke-dasharray:none}}
    </style>
  </defs>
  <rect width="1200" height="390" rx="12" fill="#0d1117"/>
  <rect x=".5" y=".5" width="1199" height="389" rx="11.5" fill="none" stroke="#30363d"/>
  <rect x="1" y="1" width="1198" height="54" rx="11" fill="#161b22"/>
  <path d="M1 44h1198v11H1z" fill="#161b22"/>
  <circle cx="28" cy="28" r="5" fill="#6e7681" opacity=".55"/>
  <circle cx="46" cy="28" r="5" fill="#6e7681" opacity=".38"/>
  <circle cx="64" cy="28" r="5" fill="#6e7681" opacity=".22"/>
  <text x="92" y="33" class="header">SPYLEAN.ME / PUBLIC.SIGNAL</text>
  <circle cx="1036" cy="28" r="4" fill="#3fb950" class="pulse"/>
