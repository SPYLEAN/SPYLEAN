<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">SPYLEAN Capability Matrix</title>
  <desc id="desc">Product systems, AI intelligence and creative systems capabilities.</desc>
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0E0A15" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#EDECE8"/>
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#C9C5C0" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="38" fill="#6D28D9" font-size="10" font-weight="700" letter-spacing="3">02 — CAPABILITY MATRIX / CREATIVE × TECH</text>
    <text x="34" y="75" fill="#0E0A15" font-size="30" font-weight="900" letter-spacing="1.8">THREE SYSTEMS. ONE BUILDER.</text>
    <text x="1005" y="69" fill="#514B58" font-size="9" font-weight="700" letter-spacing="2">STRATEGY → SYSTEM → EXPERIENCE</text>

    <g transform="translate(34 108)" filter="url(#shadow)">
      <rect width="384" height="215" rx="14" fill="#F8F7F4" stroke="#D2CED5"/>
      <rect width="384" height="5" rx="2.5" fill="url(#violet)"/>
      <text x="22" y="37" fill="#6D28D9" font-size="9" font-weight="700" letter-spacing="2.2">01 / PRODUCT SYSTEMS</text>
      <text x="22" y="71" fill="#0E0A15" font-size="20" font-weight="900">BUILD THE MACHINE.</text>
      <g font-size="11" fill="#3E3942">
        <rect x="22" y="91" width="8" height="8" rx="2" fill="#9165E5"/><text x="42" y="100">React · Next.js · TypeScript</text>
        <rect x="22" y="121" width="8" height="8" rx="2" fill="#9165E5"/><text x="42" y="130">Node.js · Express · REST APIs</text>
        <rect x="22" y="151" width="8" height="8" rx="2" fill="#9165E5"/><text x="42" y="160">SQLite · Tailwind CSS · Vite</text>
        <rect x="22" y="181" width="8" height="8" rx="2" fill="#9165E5"/><text x="42" y="190">UX logic · frontend architecture</text>
      </g>
    </g>

    <g transform="translate(448 108)" filter="url(#shadow)">
      <rect width="384" height="215" rx="14" fill="#F8F7F4" stroke="#D2CED5"/>
      <rect width="384" height="5" rx="2.5" fill="#22D3EE"/>
      <text x="22" y="37" fill="#0E7490" font-size="9" font-weight="700" letter-spacing="2.2">02 / AI &amp; INTELLIGENCE</text>
      <text x="22" y="71" fill="#0E0A15" font-size="20" font-weight="900">MAKE IT THINK.</text>
      <g font-size="11" fill="#3E3942">
        <rect x="22" y="91" width="8" height="8" rx="2" fill="#22D3EE"/><text x="42" y="100">Python · Gemini · LangChain</text>
        <rect x="22" y="121" width="8" height="8" rx="2" fill="#22D3EE"/><text x="42" y="130">Hugging Face · DBSCAN models</text>
        <rect x="22" y="151" width="8" height="8" rx="2" fill="#22D3EE"/><text x="42" y="160">Prompt systems · structured fallback</text>
        <rect x="22" y="181" width="8" height="8" rx="2" fill="#22D3EE"/><text x="42" y="190">Automation · analytical workflows</text>
      </g>
    </g>

    <g transform="translate(862 108)" filter="url(#shadow)">
      <rect width="384" height="215" rx="14" fill="#F8F7F4" stroke="#D2CED5"/>
      <rect width="384" height="5" rx="2.5" fill="#34D399"/>
      <text x="22" y="37" fill="#047857" font-size="9" font-weight="700" letter-spacing="2.2">03 / CREATIVE SYSTEMS</text>
      <text x="22" y="71" fill="#0E0A15" font-size="20" font-weight="900">MAKE IT MATTER.</text>
      <g font-size="11" fill="#3E3942">
        <rect x="22" y="91" width="8" height="8" rx="2" fill="#34D399"/><text x="42" y="100">Brand strategy · positioning</text>
        <rect x="22" y="121" width="8" height="8" rx="2" fill="#34D399"/><text x="42" y="130">Visual storytelling · campaigns</text>
        <rect x="22" y="151" width="8" height="8" rx="2" fill="#34D399"/><text x="42" y="160">Premiere Pro · Photoshop · Canva</text>
        <rect x="22" y="181" width="8" height="8" rx="2" fill="#34D399"/><text x="42" y="190">Creative direction · production</text>
      </g>
    </g>
  </g>
</svg>
